<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HD3 - Live Input</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #334155; margin: 0; padding: 24px; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    label { font-weight: 600; }
    #live-input { flex: 1 1 200px; padding: 10px 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 8px; }
    #live-input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.2); }
    #live-span { font-weight: 700; color: #4f46e5; min-width: 120px; }
    #live-title { margin-top: 20px; color: #0b0f19; word-break: break-word; }
    #char-count { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hoạt động 3: Live Input</h1>

    <div class="row">
      <label for="live-input">Nhập chữ:</label>
      <input type="text" id="live-input" placeholder="Gõ gì đó..." autocomplete="off">
      <!-- Thẻ span bên cạnh: hiện nội dung ngay khi gõ -->
      <span id="live-span">(chưa nhập)</span>
    </div>

    <!-- Thẻ h2 bên dưới: cũng hiện ngay nội dung -->
    <h2 id="live-title">Xin chào!</h2>
    <p id="char-count">Số ký tự: 0</p>
  </div>

  <script>
    var input = document.getElementById('live-input');
    var liveSpan = document.getElementById('live-span');
    var liveTitle = document.getElementById('live-title');
    var charCount = document.getElementById('char-count');

    // Sự kiện 'input' chạy mỗi lần nội dung ô nhập thay đổi (gõ, xóa, dán)
    input.addEventListener('input', function () {
      var value = input.value;                       // lấy giá trị hiện tại của ô input
      liveSpan.textContent = value || '(chưa nhập)'; // hiện vào <span> (textContent: không chèn HTML)
      liveTitle.textContent = value || 'Xin chào!';  // hiện vào <h2>
      charCount.textContent = 'Số ký tự: ' + value.length;
    });
  </script>
</body>
</html>
